<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        /* Reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #1a1a1a;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 600px;
            padding: 20px 0;
            text-align: center;
        }
        h1 {
            font-weight: 300;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #ccc;
        }
        .input-group {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            background: #2a2a2a;
            border-radius: 30px;
            padding: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 100%;
        }
        input[type="text"] {
            flex: 1 1 auto;
            min-width: 80px;
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 1rem;
            color: #eee;
            outline: none;
            border-radius: 30px;
        }
        input[type="text"]::placeholder {
            color: #777;
        }
        button {
            flex-shrink: 0;
            background: #3b82f6;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }
        button:hover {
            background: #2563eb;
        }
        .hint {
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: #666;
        }
        .quick-access {
            margin-top: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .quick-access a {
            background: #2a2a2a;
            padding: 8px 16px;
            border-radius: 20px;
            color: #8ab4f8;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .quick-access a:hover {
            background: #333;
        }

        /* Small screens: make input smaller */
        @media (max-width: 480px) {
            .container {
                width: 95%;
            }
            input[type="text"] {
                font-size: 0.9rem;
                padding: 10px 12px;
            }
            button {
                font-size: 0.9rem;
                padding: 8px 14px;
            }
            .quick-access a {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Tab</h1>
        <form id="urlForm" class="input-group">
            <input type="text" id="urlInput" placeholder="Enter URL" autofocus>
            <button type="submit">Go</button>
        </form>

        <div class="quick-access">
            <a id="quickDeepSeek">chat.deepseek.com</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('urlForm');
        const input = document.getElementById('urlInput');
        const quickDeepSeek = document.getElementById('quickDeepSeek');

        function navigateTo(url) {
            let finalUrl = url.trim();
            if (!finalUrl) return;
            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                finalUrl = 'https://' + finalUrl;
            }
            window.location.href = finalUrl;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            navigateTo(input.value);
        });

        quickDeepSeek.addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo('chat.deepseek.com');
        });

        input.focus();
    </script>
</body>
</html>
